[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sub2api-401-recovery"
version = "0.1.0"
description = "Companion service for recovering OpenAI OAuth accounts managed by Sub2API"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0,<47.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
]
browser = [
  "playwright>=1.48,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
