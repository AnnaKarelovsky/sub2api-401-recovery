services:
  recovery-api:
    image: ${RECOVERY_IMAGE:-ghcr.io/annakarelovsky/sub2api-401-recovery:${RECOVERY_VERSION:-v0.4.19}}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/recovery.db
      BACKUP_DIR: /backups
      EVIDENCE_DIR: /evidence
      EVIDENCE_MOUNT_REQUIRED: "true"
      UPDATE_MODE: ${UPDATE_MODE:-release}
      UPDATE_AGENT_URL: http://recovery-update-agent:1456
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:?Set UPDATE_AGENT_TOKEN in .env}
      RECOVERY_IMAGE: ${RECOVERY_IMAGE:-}
    ports:
      - "${APP_PORT:-1455}:1455"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ${EVIDENCE_HOST_DIR:-./evidence}:/evidence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1455/api/v1/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  recovery-worker:
    image: ${RECOVERY_IMAGE:-ghcr.io/annakarelovsky/sub2api-401-recovery:${RECOVERY_VERSION:-v0.4.19}}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/recovery.db
      BACKUP_DIR: /backups
      EVIDENCE_DIR: /evidence
      EVIDENCE_MOUNT_REQUIRED: "true"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ${EVIDENCE_HOST_DIR:-./evidence}:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      recovery-api:
        condition: service_healthy
    restart: unless-stopped

  recovery-update-agent:
    image: ${UPDATE_AGENT_IMAGE:-ghcr.io/annakarelovsky/sub2api-401-recovery:${RECOVERY_VERSION:-v0.4.19}}
    command: ["python", "-m", "app.update_agent"]
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:?Set UPDATE_AGENT_TOKEN in .env}
      UPDATE_PROJECT_DIR: ${PWD:-/workspace}
      UPDATE_CURRENT_VERSION: ${RECOVERY_VERSION:-v0.4.19}
      UPDATE_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      - .:${PWD:-/workspace}
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
