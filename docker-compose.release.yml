services:
  recovery-api:
    image: ${RECOVERY_IMAGE:-ghcr.io/annakarelovsky/sub2api-401-recovery:v0.4.16}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/recovery.db
      BACKUP_DIR: /backups
      EVIDENCE_DIR: /evidence
      EVIDENCE_MOUNT_REQUIRED: "true"
    ports:
      - "${APP_PORT:-1455}:1455"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ${EVIDENCE_HOST_DIR:-./evidence}:/evidence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1455/api/v1/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  recovery-worker:
    image: ${RECOVERY_IMAGE:-ghcr.io/annakarelovsky/sub2api-401-recovery:v0.4.16}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/recovery.db
      BACKUP_DIR: /backups
      EVIDENCE_DIR: /evidence
      EVIDENCE_MOUNT_REQUIRED: "true"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ${EVIDENCE_HOST_DIR:-./evidence}:/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      recovery-api:
        condition: service_healthy
    restart: unless-stopped
